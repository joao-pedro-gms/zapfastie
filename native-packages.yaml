# Shared CLI: gem install native-packages --version 0.11.0
---
schema: 1
tool:
  version: 0.11.0
  nfpm: 2.47.0
# Ubuntu 24.04 and Debian 13 use the t64 package names; older releases the
# plain ones. Sound goes to PipeWire itself, else PulseAudio, else ALSA.
libraries:
  libasound.so.2:
    deb: libasound2t64 | libasound2
    rpm: alsa-lib
  libpipewire-0.3.so.0:
    deb: libpipewire-0.3-0t64 | libpipewire-0.3-0
    rpm: pipewire-libs
nfpm:
  name: zapfastie
  maintainer: Carmine Paolino <carmine@paolino.me>
  homepage: https://zapfast.rocks
  description: Fast native WhatsApp client
  license: MIT
  provides: [fastsapp]
  conflicts: [fastsapp]
  replaces: [fastsapp]
  contents:
  - src: "@PAYLOAD@/zapfastie-v@VERSION@-@TARGET@/zapfastie"
    dst: "/usr/bin/zapfastie"
    file_info:
      mode: 493
  - src: "@PAYLOAD@/zapfastie-v@VERSION@-@TARGET@/LICENSE"
    dst: "/usr/share/licenses/zapfastie/LICENSE"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zapfastie-v@VERSION@-@TARGET@/README.md"
    dst: "/usr/share/doc/zapfastie/README.md"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zapfastie-v@VERSION@-@TARGET@/packaging/applications/zapfastie.desktop"
    dst: "/usr/share/applications/zapfastie.desktop"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zapfastie-v@VERSION@-@TARGET@/packaging/icons/zapfastie.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/zapfastie.svg"
    file_info:
      mode: 420
  - src: contrib/omarchy/zapfastie.json.tpl
    dst: /usr/share/zapfastie/omarchy/zapfastie.json.tpl
    file_info:
      mode: 420
  - src: contrib/omarchy/zapfastie-theme
    dst: /usr/share/zapfastie/omarchy/zapfastie-theme
    file_info:
      mode: 493
  # native-packages adds the C library (libc6, glibc) at the version the
  # binary needs: 2.36, as the release builds run in Debian 12.
  overrides:
    deb:
      depends:
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libasound2t64 | libasound2
      - libpipewire-0.3-0t64 | libpipewire-0.3-0
      - libgcc-s1
      - libstdc++6
    rpm:
      depends:
      - libglvnd-glx
      - libglvnd-egl
      - libxkbcommon
      - libxkbcommon-x11
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl
      - libX11
      - libX11-xcb
      - libXcursor
      - libXi
      - libXrandr
      - alsa-lib
      - pipewire-libs
      - libgcc
      - libstdc++
  rpm:
    buildhost: github-actions
# Windows code and installers are signed through Azure Artifact Signing as
# PlentyLabs when the windows-signing environment provides the account
# (PACKAGING.md, "Windows signing").
windows:
  signing:
    provider: azure-artifact-signing
    description: ZapFastie
    publisher: PlentyLabs UG (haftungsbeschränkt) & Co. KG
targets:
  macos-universal:
    platform: macos
    arch: universal
    formats: [dmg]
    input:
      kind: directory
      local: dist/macos-input
    native:
      command: [ruby, packaging/macos/dmg.rb, '@PAYLOAD@', '@PACKAGE@']
      output: 'zapfastie-@TAG@-macos-universal.dmg'
  windows-amd64:
    platform: windows
    arch: amd64
    formats: [msi]
    input:
      kind: directory
      local: dist/windows-input-x86_64-pc-windows-msvc
    native:
      command: [ruby, packaging/windows/msi.rb, '@PAYLOAD@', '@PACKAGE@', '@VERSION@']
      output: 'zapfastie-@TAG@-x86_64-pc-windows-msvc.msi'
  windows-arm64:
    platform: windows
    arch: arm64
    formats: [msi]
    input:
      kind: directory
      local: dist/windows-input-aarch64-pc-windows-msvc
    native:
      command: [ruby, packaging/windows/msi.rb, '@PAYLOAD@', '@PACKAGE@', '@VERSION@']
      output: 'zapfastie-@TAG@-aarch64-pc-windows-msvc.msi'
  linux-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    compiler_target: x86_64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    - appimage
    input:
      local: dist/zapfastie-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
      release_asset: zapfastie-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  linux-arm64:
    platform: linux
    arch: arm64
    libc: glibc
    compiler_target: aarch64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    - appimage
    input:
      local: dist/zapfastie-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
      release_asset: zapfastie-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
release:
  repository: joao-pedro-gms/zapfastie
  checksums: checksums.txt
  prereleases: true
assets:
  AMD64:
    file: zapfastie-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
    local: dist/zapfastie-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  ARM64:
    file: zapfastie-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
    local: dist/zapfastie-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  MACOS:
    file: zapfastie-v@VERSION@-macos-universal.dmg
    local: dist/zapfastie-v@VERSION@-macos-universal.dmg
  SOURCE:
    file: zapfastie-@VERSION@.tar.gz
    url: https://github.com/joao-pedro-gms/zapfastie/archive/refs/tags/v@VERSION@.tar.gz
    checksummed: false
    local: dist/zapfastie-@VERSION@.tar.gz
templates:
  homebrew/zapfastie.rb: packaging/homebrew/zapfastie.rb.in
  arch/zapfastie/PKGBUILD: packaging/arch/zapfastie/PKGBUILD.in
  arch/zapfastie/zapfastie.install: packaging/arch/zapfastie.install
  arch/zapfastie-bin/PKGBUILD: packaging/arch/zapfastie-bin/PKGBUILD.in
  arch/zapfastie-bin/zapfastie-bin.install: packaging/arch/zapfastie.install
  arch/zapfastie-git/PKGBUILD: packaging/arch/zapfastie-git/PKGBUILD.in
  arch/zapfastie-git/zapfastie-git.install: packaging/arch/zapfastie.install
repositories:
  homebrew:
    url: https://github.com/crmne/homebrew-tap.git
    push_url: https://github.com/crmne/homebrew-tap.git
    branch: main
    package_path: Casks
    files:
      homebrew/zapfastie.rb: Casks/zapfastie.rb
    version_file: Casks/zapfastie.rb
    version_pattern: 'version "([^"]+)"'
    publish: push
  aur-source:
    group: aur
    url: https://aur.archlinux.org/zapfastie.git
    push_url: ssh://aur@aur.archlinux.org/zapfastie.git
    branch: master
    package_path: "."
    files:
      arch/zapfastie: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-bin:
    group: aur
    url: https://aur.archlinux.org/zapfastie-bin.git
    push_url: ssh://aur@aur.archlinux.org/zapfastie-bin.git
    branch: master
    package_path: "."
    files:
      arch/zapfastie-bin: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-git:
    group: aur
    url: https://aur.archlinux.org/zapfastie-git.git
    push_url: ssh://aur@aur.archlinux.org/zapfastie-git.git
    branch: master
    package_path: "."
    files:
      arch/zapfastie-git: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
version_file: Cargo.toml
